[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-fasthtml-sortable-queue"
dynamic = ["version"]
description = "A reusable FastHTML component for Sortable.js-enhanced ordered queue panels with drag-and-drop reorder, keyboard navigation, and HTMX-powered mutations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['python-fasthtml', 'cjm-fasthtml-app-core>=0.0.21', 'cjm-fasthtml-tailwind>=0.0.44', 'cjm-fasthtml-daisyui>=0.0.15', 'cjm_fasthtml_lucide_icons>=0.0.1', 'cjm-fasthtml-keyboard-navigation>=0.0.27', 'cjm_fasthtml_design_system>=0.0.13']

[project.urls]
Repository = "https://github.com/cj-mills/cjm-fasthtml-sortable-queue"
Documentation = "https://cj-mills.github.io/cjm-fasthtml-sortable-queue"

[project.entry-points.nbdev]
cjm_fasthtml_sortable_queue = "cjm_fasthtml_sortable_queue._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "cjm_fasthtml_sortable_queue.__version__"}

[tool.setuptools.packages.find]
include = ["cjm_fasthtml_sortable_queue*"]

[tool.nbdev]
